name: zh installer lint

# The Chinese fork ships two installer scripts that its users pipe straight into
# a shell. They are authored on macOS, where PowerShell is usually absent, so
# they are parsed and then actually RUN on real Windows and Linux runners here.
# Parsing alone would not have caught the PATH bug a user hit on Windows, where
# npm installs the global shim into a directory the running shell's PATH
# snapshot does not contain.
on:
  push:
    branches: [zh-hans]
    paths:
      - windows/Scripts/install-zh.ps1
      - mac/Scripts/install-zh.sh
      - .github/workflows/zh-installer-lint.yml
  pull_request:
    paths:
      - windows/Scripts/install-zh.ps1
      - mac/Scripts/install-zh.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse install-zh.ps1
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'windows/Scripts/install-zh.ps1'), [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }
          Write-Host 'install-zh.ps1 parses cleanly.'
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          $found = Invoke-ScriptAnalyzer -Path windows/Scripts/install-zh.ps1 -Severity Error,Warning
          $found | Format-Table -AutoSize
          if ($found | Where-Object Severity -eq 'Error') { exit 1 }

  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check install-zh.sh
        run: bash -n mac/Scripts/install-zh.sh
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning mac/Scripts/install-zh.sh

  windows-install:
    # Runs the installer the way a user does. --CliOnly keeps it to the npm
    # package, so no MSI is installed on the runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Run install-zh.ps1 -CliOnly under a Restricted execution policy
        # Windows Server and locked-down machines block .ps1 files, and npm ships
        # an npm.ps1 that PowerShell prefers — which killed the install before it
        # could even reach its own policy warning. Run the way a real user does
        # (piped into iex, which Restricted still allows) with the policy set to
        # Restricted, so that failure mode is caught here rather than by a user.
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Restricted -Force
          Write-Host "policy: $(Get-ExecutionPolicy -Scope Process)"
          $source = Get-Content -Raw ./windows/Scripts/install-zh.ps1
          & ([scriptblock]::Create($source)) -CliOnly
      - name: codeburn.cmd must work even when .ps1 execution is blocked
        # Windows Server and locked-down machines default to a Restricted
        # execution policy, which blocks the codeburn.ps1 shim npm installs.
        # The .cmd shim is the escape hatch the installer points users at, so
        # it has to actually work.
        shell: pwsh
        run: |
          $out = (& codeburn.cmd --version)
          Write-Host "codeburn.cmd version: $out"
          if (-not $out) { throw 'codeburn.cmd produced no version' }

      - name: codeburn must be usable in a fresh shell
        shell: pwsh
        run: |
          $version = (& codeburn --version)
          Write-Host "version: $version"
          if (-not $version) { throw 'codeburn produced no version' }
          $lang = (& codeburn lang) -join "`n"
          Write-Host $lang
          if ($lang -notmatch 'zh-CN') { throw 'installer did not set the language to zh-CN' }
      - name: the terminal dashboard must render
        shell: pwsh
        run: |
          $out = (& codeburn today) -join "`n"
          if (-not $out) { throw 'codeburn today produced no output' }
          Write-Host $out

  linux-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Run install-zh.sh --cli-only
        run: bash ./mac/Scripts/install-zh.sh --cli-only
      - name: codeburn must be usable in a fresh shell
        run: |
          set -euo pipefail
          codeburn --version
          codeburn lang | grep -q 'zh-CN' || { echo 'installer did not set the language'; exit 1; }
          codeburn today > /dev/null
