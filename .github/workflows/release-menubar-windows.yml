name: Release Windows Menubar

# Triggers on a `windows-v*` tag push (e.g. `git tag windows-v0.9.20 && git push origin
# windows-v0.9.20`), or manually via the Actions tab. Mirrors release-menubar.yml, which
# does the same job for the macOS menubar under the `mac-v*` tags. The produced `.msi` is
# unsigned; users see a SmartScreen prompt on first run until we add signing.
on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the bundle (e.g. v0.9.20 or dev-preview)'
        required: true
        default: 'dev-preview'

permissions:
  contents: write  # Needed to create the release + upload assets.

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version label
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/windows-v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/windows-}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri

      - name: Install dependencies
        working-directory: windows
        run: npm ci

      - name: Resolve bundle version
        id: bundle
        shell: bash
        run: |
          # Every zh release shipped ProductVersion 0.9.23, so Windows' Apps list could
          # not tell zh5 from zh7 and upgrades had nothing but the ProductCode to go on.
          # A tag windows-v0.9.23-zh8 becomes the semver 0.9.23+8: tauri-bundler turns
          # numeric build metadata into the MSI's fourth field (0.9.23.8), which Windows
          # shows in Apps but ignores when comparing versions, so the upgrade path is
          # unchanged. The asset keeps a URL-safe name with the zh number in it.
          label='${{ steps.version.outputs.value }}'
          base=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          if [[ "$label" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-zh([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"; n="${BASH_REMATCH[2]}"
            echo "semver=${base}+${n}" >> "$GITHUB_OUTPUT"
            echo "asset=CodeBurn.Menubar_${base}-zh${n}_x64_en-US.msi" >> "$GITHUB_OUTPUT"
          else
            echo "semver=${base}" >> "$GITHUB_OUTPUT"
            echo "asset=CodeBurn.Menubar_${base}_x64_en-US.msi" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      - name: Build MSI bundle
        working-directory: windows
        shell: bash
        run: npm run tauri build -- --config '{"version":"${{ steps.bundle.outputs.semver }}"}'

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find windows/src-tauri/target/release/bundle -type f -name '*.msi' \
            -exec cp -v {} "release-artifacts/${{ steps.bundle.outputs.asset }}" \;
          (cd release-artifacts && for f in *.msi; do sha256sum "$f" > "$f.sha256"; done)
          ls -la release-artifacts

      - name: Upload artifact (for manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: CodeBurnMenubar-Windows-${{ steps.version.outputs.value }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Windows Menubar ${{ steps.version.outputs.value }}
          body: |
            ## 安装

            推荐用一键脚本，它会装好**中文版命令行 + 这个托盘应用**并设为中文，重复运行安全：

            ```powershell
            irm https://raw.githubusercontent.com/TheCrazyAnt/codeburn/zh-hans/windows/Scripts/install-zh.ps1 | iex
            ```

            只想手动装 `.msi`：托盘应用只是壳，数据全靠命令行，请先按
            [README.zh-CN.md](https://github.com/TheCrazyAnt/codeburn/blob/zh-hans/README.zh-CN.md#windows)
            装中文版命令行（`npm install -g codeburn` 装到的是上游英文版）。

            需要 Node.js 22.13+ 和 WebView2 运行时（Windows 11 自带）。首次安装会弹 UAC；安装包未签名，
            SmartScreen 首次会拦截，点「更多信息」→「仍要运行」。

            版本号 `${{ steps.bundle.outputs.semver }}`；Windows「应用」列表显示为四段形式。
          files: release-artifacts/*
          fail_on_unmatched_files: true
